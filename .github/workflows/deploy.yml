name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Bing (IndexNow)
        run: |
          curl -sS "https://www.bing.com/ping?sitemap=https://naufalrakha.my.id/sitemap.xml" -o /dev/null -w "Bing: %{http_code}\n"

      - name: Submit sitemap to Google Search Console
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python3 scripts/submit-sitemap.py \
            "https://naufalrakha.my.id" \
            "https://naufalrakha.my.id/sitemap.xml"
          rm -f /tmp/gcp-key.pem
