<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Halaman Ra Ketemu | Naufal Rakha Putra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fde047;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      position: relative;
      max-width: 560px;
      width: 100%;
    }
    .box {
      background: #fff;
      border: 6px solid #000;
      padding: 48px;
      width: 100%;
      box-shadow: 12px 12px 0 #000;
      text-align: center;
      position: relative;
      rotate: -1.5deg;
    }
    .box-inner {
      rotate: 1.5deg;
    }
    .code {
      font-size: clamp(80px, 20vw, 140px);
      font-weight: 900;
      color: #ef4444;
      line-height: 1;
      letter-spacing: -6px;
      text-shadow: 6px 6px 0 #000;
      margin-bottom: 4px;
    }
    .label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      background: #000;
      color: #fff;
      display: inline-block;
      padding: 4px 14px;
      margin-bottom: 16px;
      rotate: 2deg;
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 6px;
    }
    .fun-fact {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      background: #f3f4f6;
      border: 2px solid #000;
      padding: 10px 14px;
      margin: 16px 0 24px;
      text-align: left;
    }
    .fun-fact strong {
      font-size: 10px;
      text-transform: uppercase;
      background: #000;
      color: #fff;
      padding: 2px 8px;
      display: inline-block;
      margin-bottom: 6px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      display: inline-block;
      background: #000;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 12px 24px;
      border: 4px solid #000;
      box-shadow: 6px 6px 0 #000;
      transition: all 0.12s ease;
    }
    .btn:hover {
      translate: -3px -3px;
      box-shadow: 9px 9px 0 #000;
    }
    .btn-pink:hover { background: #ec4899; }
    .btn-blue:hover { background: #3b82f6; color: #fff; }
    .btn-green:hover { background: #22c55e; color: #000; }
    .deco {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 4px solid #000;
      z-index: -1;
    }
    .deco.tl { top: -16px; left: -16px; background: #3b82f6; rotate: 12deg; }
    .deco.br { bottom: -16px; right: -16px; background: #ec4899; rotate: -8deg; }
    .deco.dots {
      width: auto;
      height: auto;
      border: none;
      background: none;
      bottom: -50px;
      left: 0;
      z-index: 0;
    }
    .dot-grid { display: flex; gap: 10px; }
    .dot-grid span { width: 6px; height: 6px; background: #000; border-radius: 50%; opacity: 0.2; }
    @media(prefers-color-scheme:dark) {
      body { background: #000; }
      .box { background: #111; border-color: #fff; box-shadow: 12px 12px 0 #fff; }
      .code { text-shadow: 6px 6px 0 #fff; }
      .label { background: #fde047; color: #000; }
      h1, p { color: #fff; }
      .fun-fact { background: #1f2937; border-color: #fff; color: #d1d5db; }
      .fun-fact strong { background: #fde047; color: #000; }
      .btn { background: #fde047; color: #000; border-color: #fde047; box-shadow: 6px 6px 0 #fde047; }
      .btn:hover { box-shadow: 9px 9px 0 #fde047; }
      .btn-pink:hover { background: #ec4899; color: #fff; }
      .btn-blue:hover { background: #3b82f6; color: #fff; }
      .btn-green:hover { background: #22c55e; color: #000; }
      .deco { border-color: #fff; }
      .deco.tl { background: #ec4899; }
      .deco.br { background: #3b82f6; }
      .dot-grid span { background: #fff; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <div class="box-inner">
        <div class="deco tl"></div>
        <div class="deco br"></div>
        <div class="label">⚠ HTTP 404</div>
        <div class="code">404</div>
        <h1>Halaman Ra Ketemu</h1>
        <p>Halaman yang lo cari gak ada, udah dipindah, atau dihapus.</p>
        <p style="opacity:0.6;font-size:11px;">Mungkin salah ketik? Atau jangan-jangan ini <em>alternate reality</em>?</p>

        <div class="fun-fact" id="funfact">
          <strong>🧠 Fun Fact</strong>
          <span id="fact-text">Naufal pernah bikin 25+ proyek dalam 2 tahun. Ini mah cuma halaman 404.</span>
        </div>

        <div class="btn-group">
          <a href="/" class="btn btn-pink">← Balik ke Beranda</a>
          <a href="/blog" class="btn btn-blue">📝 Blog</a>
          <a href="/cv" class="btn btn-green">📄 CV</a>
        </div>
      </div>
    </div>
    <div class="deco dots">
      <div class="dot-grid">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <script>
    const facts = [
      'Naufal pernah bikin 25+ proyek dalam 2 tahun. Ini mah cuma halaman 404.',
      'Proyek pertama Naufal? Website PHP native pas masih SMK.',
      'Naufal bisa konfigurasi MikroTik sambil rebahan.',
      'Game Android Naufal udah di-download 60+ kali di Google Play.',
      'Naufal pernah jadi finalis CTF nasional — Zero Day 2026.',
      'IPK semester 1 Naufal: 4.00. Gas pol!',
      'Naufal ngelola 7+ domain dan 5+ Vercel project sendirian.',
      'Senin Terus Studio — studio game milik Naufal, rilis game visual novel di itch.io.',
      'Naufal paham OTDR, splicing fiber optik, sampe Linux server Debian.',
      'Fitur favorit Naufal di React? Custom hooks & server state management.'
    ]
    document.getElementById('fact-text').textContent = facts[Math.floor(Math.random() * facts.length)]
  </script>
</body>
</html>
