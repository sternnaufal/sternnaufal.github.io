<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donasi | Naufal Rakha Putra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fde047;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      padding: 24px;
    }
    header {
      text-align: center;
      padding: 40px 20px;
      background: #000;
      color: #fff;
      border: 6px solid #000;
      box-shadow: 10px 10px 0 #000;
      margin-bottom: 40px;
      rotate: -1deg;
    }
    header h1 {
      font-size: 36px;
      font-weight: 900;
      text-transform: uppercase;
    }
    header p {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      margin-top: 8px;
    }
    main {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .card {
      background: #fff;
      border: 5px solid #000;
      padding: 32px;
      box-shadow: 8px 8px 0 #000;
      text-align: center;
    }
    .card h2 {
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .card p {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #000;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 10px 24px;
      border: 4px solid #000;
      box-shadow: 5px 5px 0 #000;
      transition: all 0.15s ease;
    }
    .btn:hover {
      translate: -2px -2px;
      box-shadow: 7px 7px 0 #000;
      background: #ec4899;
    }
    .btn-pink:hover { background: #ec4899; }
    .btn-blue:hover { background: #3b82f6; }
    .btn-green:hover { background: #22c55e; }
    .btn-red:hover { background: #ef4444; }
    .navigasi {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 24px;
    }
    .navigasi a {
      color: #000;
      font-weight: 700;
      text-transform: uppercase;
      text-decoration: underline 4px;
    }
    #widget-container {
      margin-top: 12px;
      min-height: 60px;
    }
    #widget-container iframe {
      max-width: 100%;
      border: 3px solid #000;
    }
    .widget-select {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .widget-select button {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 6px 14px;
      background: #fff;
      border: 3px solid #000;
      cursor: pointer;
      transition: all 0.15s;
    }
    .widget-select button:hover,
    .widget-select button.active {
      background: #000;
      color: #fff;
    }
    @media(prefers-color-scheme:dark) {
      body { background: #000; }
      .card { background: #111; border-color: #fff; box-shadow: 8px 8px 0 #fff; }
      .card h2, .card p { color: #fff; }
      .btn { background: #fde047; color: #000; border-color: #fde047; box-shadow: 5px 5px 0 #fde047; }
      .btn:hover { background: #ec4899; color: #fff; }
      .navigasi a { color: #fde047; text-decoration-color: #fde047; }
      .widget-select button { background: #222; color: #fff; border-color: #fff; }
      .widget-select button:hover,
      .widget-select button.active { background: #fde047; color: #000; }
    }
  </style>
</head>
<body>
  <header>
    <h1>☕ Traktir Kopi</h1>
    <p>Dukung karya gue biar makin semangat ngoding & bikin game!</p>
  </header>

  <main>
    <div class="card" style="rotate: 1deg;">
      <h2>Donasi Now</h2>
      <p>Scan QR atau klik tombol di bawah buat donasi via Saweria.</p>
      <a id="saweria-btn" class="btn btn-pink" href="https://saweria.co/naufalrakha" target="_blank">Donasi Sekarang</a>
    </div>

    <div class="card" style="rotate: -1deg;">
      <h2>Widget Saweria</h2>
      <p>Pilih widget buat liat activity donasi real-time.</p>
      <div class="widget-select" id="widget-select"></div>
      <div id="widget-container"></div>
    </div>

    <div class="navigasi">
      <a href="/">← Balik ke Beranda</a>
    </div>
  </main>

  <script>
    const STREAM_KEY = ['2e66e738','ef922ef2','cf6fb350','1d296560'].join('');
    const WIDGETS = [
      { label: 'Running Text', url: 'https://saweria.co/widgets/recent?streamKey=' + STREAM_KEY },
      { label: 'Leaderboard', url: 'https://saweria.co/widgets/leaderboard?streamKey=' + STREAM_KEY },
      { label: 'Milestone', url: 'https://saweria.co/widgets/milestone?streamKey=' + STREAM_KEY },
      { label: 'QR Code', url: 'https://saweria.co/widgets/qr?streamKey=' + STREAM_KEY },
    ];

    const select = document.getElementById('widget-select');
    const container = document.getElementById('widget-container');

    WIDGETS.forEach(function(w, i) {
      var btn = document.createElement('button');
      btn.textContent = w.label;
      btn.onclick = function() {
        document.querySelectorAll('#widget-select button').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        container.innerHTML = '';
        var iframe = document.createElement('iframe');
        iframe.src = w.url;
        iframe.width = '100%';
        iframe.height = '400';
        iframe.style.border = '3px solid #000';
        container.appendChild(iframe);
      };
      select.appendChild(btn);
    });
  </script>
</body>
</html>
